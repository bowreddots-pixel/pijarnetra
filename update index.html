<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pijar Netra POS</title>
<style>
:root{--bg:#0f0f0f;--card:#1a1a1a;--card2:#222;--border:#2a2a2a;--text:#F5E8C7;--muted:#A89F8A;--accent:#2E5A27;--accent-light:#3d7a35;--danger:#ff4757;--warning:#ffa502;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#000;color:var(--text);min-height:100vh;display:flex;justify-content:center;overflow-x:hidden}
.app{width:100%;max-width:450px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;background-size:cover!important;background-position:center!important;background-repeat:no-repeat!important}
.app.has-bg::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.72);z-index:0;pointer-events:none}
.app>*{position:relative;z-index:1}
header{position:sticky;top:0;z-index:50;background:rgba(15,15,15,.92);backdrop-filter:blur(12px);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.logo{font-size:1.15rem;font-weight:700;color:var(--text)}.logo span{color:var(--accent-light)}
.header-right{display:flex;align-items:center;gap:10px}
.gear-btn{background:none;border:none;color:var(--text);font-size:1.2rem;cursor:pointer;padding:4px}
.status{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted)}
.status-dot{width:9px;height:9px;border-radius:50%;background:var(--danger);transition:background .3s}
.status-dot.connected{background:#4caf50}.status-dot.syncing{background:var(--warning);animation:pulse 1s infinite}.status-dot.error{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:52px;z-index:40}
.tab{flex:1;padding:12px 0;text-align:center;font-size:.85rem;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:var(--accent-light);border-bottom-color:var(--accent-light)}
.content{flex:1;overflow-y:auto;padding-bottom:90px}
.panel{display:none;padding:14px}.panel.active{display:block}
.cat-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:8px;scrollbar-width:none}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-btn{flex-shrink:0;padding:7px 14px;border-radius:20px;background:var(--card2);border:1px solid var(--border);color:var(--muted);font-size:.8rem;font-weight:600;cursor:pointer}
.cat-btn.active{background:var(--accent);color:#F5E8C7;border-color:var(--accent)}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu-card{background:var(--card);border-radius:var(--radius);padding:12px;border:1px solid var(--border);cursor:pointer;position:relative}
.menu-card:active{transform:scale(.97)}.menu-card.out{opacity:.45;pointer-events:none}
.menu-name{font-size:.9rem;font-weight:600;margin-bottom:4px;color:var(--text)}
.menu-price{font-size:1rem;color:var(--accent-light);font-weight:700}
.stock-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);font-size:.7rem;padding:2px 7px;border-radius:10px;color:var(--muted)}
.stock-badge.low{color:var(--warning)}.stock-badge.zero{color:var(--danger)}
.cart-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:450px;background:var(--card);border-top:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:60}
.cart-info{flex:1}.cart-count{font-size:.75rem;color:var(--muted)}.cart-total{font-size:1.2rem;font-weight:700;color:var(--accent-light)}
.btn{border:none;border-radius:12px;font-weight:700;font-size:.9rem;cursor:pointer;padding:12px 18px}
.btn:active{transform:scale(.97);opacity:.85}
.btn-primary{background:var(--accent);color:#F5E8C7}
.btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:8px 12px;font-size:.8rem}.btn-block{width:100%}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card);width:100%;max-width:450px;border-radius:20px 20px 0 0;max-height:85vh;overflow-y:auto;padding:20px 16px 30px;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:1.15rem;font-weight:700;color:var(--text)}
.close-btn{background:var(--card2);border:none;color:var(--text);width:32px;height:32px;border-radius:50%;font-size:1.1rem;cursor:pointer}
.cart-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.cart-item-info{flex:1}.cart-item-name{font-weight:600;font-size:.9rem;color:var(--text)}.cart-item-price{font-size:.8rem;color:var(--muted)}
.qty-ctrl{display:flex;align-items:center;gap:8px}
.qty-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty-val{min-width:22px;text-align:center;font-weight:700;color:var(--text)}
.remove-btn{background:none;border:none;color:var(--danger);font-size:1.1rem;cursor:pointer;padding:4px}
.pay-methods{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.pay-opt{padding:14px;border-radius:12px;border:2px solid var(--border);background:var(--card2);cursor:pointer;font-weight:600;color:var(--text);display:flex;align-items:center;gap:10px}
.pay-opt.active{border-color:var(--accent-light);background:rgba(46,90,39,.2)}.pay-opt input{display:none}
.split-box,.cash-box{display:none;margin-top:12px;padding:14px;background:var(--card2);border-radius:12px}
.split-box.show,.cash-box.show{display:block}
.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px}
.input-group input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem;font-weight:600}
.input-group input:focus{outline:none;border-color:var(--accent-light)}
.split-info{font-size:.85rem;color:var(--muted);margin-top:8px}.split-info strong{color:var(--accent-light)}
.quick-cash{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.qc-btn{padding:10px 6px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.8rem;font-weight:600;cursor:pointer}
.qc-btn:active{background:var(--accent);color:#F5E8C7}
.qc-btn.pas{grid-column:1/-1;background:rgba(46,90,39,.25);border-color:var(--accent-light);color:var(--accent-light)}
.stok-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.stok-table{width:100%;border-collapse:collapse}
.stok-table th{text-align:left;font-size:.75rem;color:var(--muted);padding:8px 4px;border-bottom:1px solid var(--border)}
.stok-table td{padding:10px 4px;border-bottom:1px solid var(--border);font-size:.85rem;vertical-align:middle;color:var(--text)}
.stok-table input{width:70px;padding:6px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.85rem;text-align:center}
.action-btns{display:flex;gap:6px}
.icon-btn{width:30px;height:30px;border-radius:8px;border:none;background:var(--card2);color:var(--text);cursor:pointer;font-size:.85rem}.icon-btn.del{color:var(--danger)}
.rekap-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.rekap-card{background:var(--card);border-radius:var(--radius);padding:14px;border:1px solid var(--border)}
.rekap-card.full{grid-column:1/-1}
.rekap-label{font-size:.75rem;color:var(--muted);margin-bottom:4px}
.rekap-val{font-size:1.3rem;font-weight:700;color:var(--accent-light)}.rekap-val.cash{color:#4caf50}.rekap-val.qris{color:#5b8def}
.trx-list{margin-top:12px}
.trx-item{background:var(--card);border-radius:12px;padding:12px 40px 12px 12px;margin-bottom:8px;border:1px solid var(--border);position:relative}
.trx-head{display:flex;justify-content:space-between;margin-bottom:4px;padding-right:8px}
.trx-date{font-size:.8rem;color:var(--muted)}.trx-total{font-weight:700;color:var(--accent-light);font-size:1rem}
.trx-method{font-size:.75rem;padding:2px 8px;border-radius:8px;background:var(--card2);color:var(--muted)}
.trx-name{font-size:.8rem;color:var(--accent-light);margin-bottom:4px;font-weight:600}
.trx-items{font-size:.8rem;color:var(--muted);margin-top:4px}
.trx-del{position:absolute;top:12px;right:12px;background:var(--card2);border:none;color:var(--danger);width:28px;height:28px;border-radius:8px;font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}.empty-icon{font-size:2.5rem;margin-bottom:10px}
.form-row{display:flex;gap:8px;margin-bottom:10px}
.form-row input,.form-row select{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.9rem}
#rekapText{width:100%;min-height:220px;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:monospace;font-size:.8rem;line-height:1.5;resize:vertical}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--accent);color:#F5E8C7;padding:10px 20px;border-radius:30px;font-weight:700;font-size:.85rem;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app" id="app">
<header>
<div class="logo">Pijar <span>Netra</span> POS</div>
<div class="header-right">
<button class="gear-btn" onclick="openBgSetting()">⚙️</button>
<div class="status"><div class="status-dot" id="statusDot"></div><span id="statusText">Connecting...</span></div>
</div>
</header>
<div class="tabs">
<div class="tab active" data-tab="kasir">Kasir</div>
<div class="tab" data-tab="stok">Stok Opname</div>
<div class="tab" data-tab="riwayat">Riwayat</div>
</div>
<div class="content">
<div class="panel active" id="panel-kasir">
<div class="cat-scroll" id="catScroll"></div>
<div class="menu-grid" id="menuGrid"></div>
</div>
<div class="panel" id="panel-stok">
<div class="stok-header">
<h3 style="font-size:1rem;color:var(--text)">Kelola Stok</h3>
<button class="btn btn-primary btn-sm" onclick="openAddMenu()">+ Menu Baru</button>
</div>
<div id="stokList"></div>
</div>
<div class="panel" id="panel-riwayat">
<div class="rekap-cards">
<div class="rekap-card full"><div class="rekap-label">Total Omset</div><div class="rekap-val total" id="omsetTotal">0</div></div>
<div class="rekap-card"><div class="rekap-label">Cash</div><div class="rekap-val cash" id="omsetCash">0</div></div>
<div class="rekap-card"><div class="rekap-label">QRIS</div><div class="rekap-val qris" id="omsetQris">0</div></div>
</div>
<div style="display:flex;gap:8px;margin-bottom:14px">
<button class="btn btn-secondary btn-block" onclick="openRekapText()">📄 Lihat & Salin Rekap</button>
<button class="btn btn-danger btn-sm" onclick="deleteAllTrx()" style="white-space:nowrap">🗑 Hapus Semua</button>
</div>
<div class="trx-list" id="trxList"></div>
</div>
</div>
<div class="cart-bar" id="cartBar" style="display:none">
<div class="cart-info"><div class="cart-count"><span id="cartCount">0</span> item</div><div class="cart-total" id="cartTotal">0</div></div>
<button class="btn btn-secondary btn-sm" onclick="resetCart()">Reset</button>
<button class="btn btn-primary" onclick="openCart()">Bayar</button>
</div>
</div>

<div class="modal-overlay" id="modalCart"><div class="modal">
<div class="modal-header"><div class="modal-title">Keranjang</div><button class="close-btn" onclick="closeModal('modalCart')">✕</button></div>
<div id="cartItems"></div>
<div style="margin-top:16px;display:flex;justify-content:space-between;align-items:center"><span style="color:var(--muted)">Total</span><span style="font-size:1.2rem;font-weight:700;color:var(--accent-light)" id="cartModalTotal">0</span></div>
<button class="btn btn-primary btn-block" style="margin-top:16px" onclick="openPayment()">Lanjut Pembayaran</button>
</div></div>

<div class="modal-overlay" id="modalPay"><div class="modal">
<div class="modal-header"><div class="modal-title">Pembayaran</div><button class="close-btn" onclick="closeModal('modalPay')">✕</button></div>
<div class="input-group" style="margin-bottom:14px"><label>Atas Nama (opsional)</label><input type="text" id="customerName" placeholder="Nama pelanggan..."></div>
<div style="margin-bottom:14px;font-size:.9rem;color:var(--muted)">Total: <strong style="color:var(--accent-light)" id="payTotal">0</strong></div>
<div class="pay-methods">
<label class="pay-opt active" data-method="cash"><input type="radio" name="payMethod" value="cash" checked> 💵 Cash</label>
<label class="pay-opt" data-method="qris"><input type="radio" name="payMethod" value="qris"> 📱 QRIS</label>
<label class="pay-opt" data-method="split"><input type="radio" name="payMethod" value="split"> 🔀 Split Payment</label>
</div>
<div class="cash-box show" id="cashBox">
<div class="quick-cash">
<button class="qc-btn pas" onclick="setCash('pas')">Uang Pas</button>
<button class="qc-btn" onclick="setCash(20000)">20</button>
<button class="qc-btn" onclick="setCash(50000)">50</button>
<button class="qc-btn" onclick="setCash(100000)">100</button>
<button class="qc-btn" onclick="addCash(5000)">+5</button>
<button class="qc-btn" onclick="addCash(10000)">+10</button>
</div>
<div class="input-group"><label>Nominal Diterima</label><input type="number" id="cashReceived" placeholder="0" min="0" oninput="calcChange()"></div>
<div class="split-info">Kembalian: <strong id="changeVal">0</strong></div>
</div>
<div class="split-box" id="splitBox">
<div class="input-group"><label>Nominal Cash</label><input type="number" id="cashInput" placeholder="0" min="0" oninput="calcSplit()"></div>
<div class="split-info">Sisa QRIS: <strong id="qrisPartVal">0</strong></div>
</div>
<button class="btn btn-primary btn-block" style="margin-top:16px" onclick="processPayment()">Konfirmasi Bayar</button>
</div></div>

<div class="modal-overlay" id="modalMenu"><div class="modal">
<div class="modal-header"><div class="modal-title" id="menuModalTitle">Tambah Menu</div><button class="close-btn" onclick="closeModal('modalMenu')">✕</button></div>
<input type="hidden" id="editMenuId">
<div class="form-row"><input type="text" id="menuName" placeholder="Nama menu"></div>
<div class="form-row"><select id="menuCat"><option value="Espresso Based">Espresso Based</option><option value="Manual Brew">Manual Brew</option><option value="Non Coffee">Non Coffee</option></select></div>
<div class="form-row"><input type="number" id="menuPrice" placeholder="Harga (contoh: 18000)" min="0"><input type="number" id="menuStock" placeholder="Stok" min="0"></div>
<button class="btn btn-primary btn-block" onclick="saveMenu()">Simpan</button>
</div></div>

<div class="modal-overlay" id="modalRekap"><div class="modal">
<div class="modal-header"><div class="modal-title">Rekap Teks</div><button class="close-btn" onclick="closeModal('modalRekap')">✕</button></div>
<textarea id="rekapText" readonly></textarea>
<button class="btn btn-primary btn-block" style="margin-top:12px" onclick="copyRekap()">📋 Salin Teks ke Clipboard</button>
</div></div>

<div class="modal-overlay" id="modalBg"><div class="modal">
<div class="modal-header"><div class="modal-title">Ganti Background</div><button class="close-btn" onclick="closeModal('modalBg')">✕</button></div>
<p style="font-size:.85rem;color:var(--muted);margin-bottom:16px">Pilih foto dari galeri untuk dijadikan background.</p>
<input type="file" id="bgInput" accept="image/*" style="display:none" onchange="handleBgFile(this)">
<button class="btn btn-primary btn-block" onclick="document.getElementById('bgInput').click()">📷 Pilih dari Galeri</button>
<button class="btn btn-secondary btn-block" style="margin-top:10px" onclick="resetBg()">🔄 Reset ke Default</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
var DB_URL='https://pijar-netra-c6555-default-rtdb.firebaseio.com';
var DEFAULT_MENUS=[
{id:'m1',name:'Long Black',price:16000,stock:50,category:'Espresso Based'},
{id:'m2',name:'Caramel Latte',price:18000,stock:50,category:'Espresso Based'},
{id:'m3',name:'Palm Sugar Latte',price:18000,stock:50,category:'Espresso Based'},
{id:'m4',name:'Coffee Latte',price:18000,stock:50,category:'Espresso Based'},
{id:'m5',name:'Blue Batak',price:20000,stock:30,category:'Manual Brew'},
{id:'m6',name:'Patuha',price:20000,stock:30,category:'Manual Brew'},
{id:'m7',name:'Garut',price:20000,stock:30,category:'Manual Brew'},
{id:'m8',name:'Matcha Latte',price:18000,stock:40,category:'Non Coffee'},
{id:'m9',name:'Choco Latte',price:18000,stock:40,category:'Non Coffee'}
];
var menus=[],transactions=[],cart=[],currentCat='Semua',payMethod='cash',currentTotal=0;
var HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
var BULAN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

function setStatus(s){var d=document.getElementById('statusDot'),t=document.getElementById('statusText');d.className='status-dot '+s;t.textContent=s==='connected'?'Connected':s==='syncing'?'Syncing...':'Error'}
function dbGet(p){setStatus('syncing');return fetch(DB_URL+p+'.json').then(function(r){if(!r.ok)throw new Error();setStatus('connected');return r.json()}).catch(function(){setStatus('error');return null})}
function dbPut(p,d){setStatus('syncing');return fetch(DB_URL+p+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(function(r){if(!r.ok)throw new Error();setStatus('connected');return true}).catch(function(){setStatus('error');return false})}
function dbPost(p,d){setStatus('syncing');return fetch(DB_URL+p+'.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(function(r){if(!r.ok)throw new Error();setStatus('connected');return r.json()}).catch(function(){setStatus('error');return null})}

function formatDateTime(ts){var d=new Date(ts);return HARI[d.getDay()]+', '+d.getDate()+' '+BULAN[d.getMonth()]+' '+String(d.getHours()).padStart(2,'0')+'.'+String(d.getMinutes()).padStart(2,'0')}

function init(){
dbGet('/').then(function(data){
if(!data||!data.menus||Object.keys(data.menus).length===0){
var obj={};DEFAULT_MENUS.forEach(function(m){obj[m.id]=m});
dbPut('/menus',obj);menus=DEFAULT_MENUS.slice()
}else menus=Object.values(data.menus);
if(data&&data.transactions){
transactions=Object.entries(data.transactions).map(function(e){return Object.assign({id:e[0]},e[1])});
transactions.sort(function(a,b){return(b.timestamp||0)-(a.timestamp||0)})
}else transactions=[];
renderCategories();renderMenus();renderStok();renderRiwayat()
})
}

document.querySelectorAll('.tab').forEach(function(t){
t.addEventListener('click',function(){
document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});
document.querySelectorAll('.panel').forEach(function(x){x.classList.remove('active')});
t.classList.add('active');document.getElementById('panel-'+t.dataset.tab).classList.add('active');
if(t.dataset.tab==='riwayat')renderRiwayat();if(t.dataset.tab==='stok')renderStok()
})
});

function renderCategories(){
var cats=['Semua'];menus.forEach(function(m){if(cats.indexOf(m.category)===-1)cats.push(m.category)});
var h='';cats.forEach(function(c){h+='<div class="cat-btn'+(c===currentCat?' active':'')+'" onclick="setCat(\''+c+'\')">'+c+'</div>'});
document.getElementById('catScroll').innerHTML=h
}
function setCat(c){currentCat=c;renderCategories();renderMenus()}

function renderMenus(){
var list=currentCat==='Semua'?menus:menus.filter(function(m){return m.category===currentCat});
var g=document.getElementById('menuGrid');
if(!list.length){g.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="empty-icon">☕</div>Belum ada menu</div>';return}
var h='';list.forEach(function(m){
var sc=m.stock<=0?'zero':(m.stock<=5?'low':''),o=m.stock<=0?' out':'';
h+='<div class="menu-card'+o+'" onclick="addToCart(\''+m.id+'\')"><div class="stock-badge '+sc+'">'+m.stock+'</div><div class="menu-name">'+m.name+'</div><div class="menu-price">'+fmt(m.price)+'</div></div>'
});g.innerHTML=h
}

function addToCart(id){
var m=menus.find(function(x){return x.id===id});if(!m||m.stock<=0)return;
var e=cart.find(function(c){return c.id===id});
if(e){if(e.qty>=m.stock){toast('Stok tidak cukup');return}e.qty++}
else cart.push({id:m.id,name:m.name,price:m.price,qty:1});
updateCartBar();toast(m.name+' ditambahkan')
}

function updateCartBar(){
var b=document.getElementById('cartBar'),c=cart.reduce(function(s,x){return s+x.qty},0),t=cart.reduce(function(s,x){return s+x.price*x.qty},0);
if(!c)b.style.display='none';else{b.style.display='flex';document.getElementById('cartCount').textContent=c;document.getElementById('cartTotal').textContent=fmt(t)}
}

function resetCart(){cart=[];updateCartBar();closeModal('modalCart');toast('Pesanan direset')}
function openCart(){renderCartItems();document.getElementById('modalCart').classList.add('show')}

function renderCartItems(){
var el=document.getElementById('cartItems'),t=cart.reduce(function(s,x){return s+x.price*x.qty},0);
document.getElementById('cartModalTotal').textContent=fmt(t);
if(!cart.length){el.innerHTML='<div class="empty"><div class="empty-icon">🛒</div>Keranjang kosong</div>';return}
var h='';cart.forEach(function(c){
h+='<div class="cart-item"><div class="cart-item-info"><div class="cart-item-name">'+c.name+'</div><div class="cart-item-price">'+fmt(c.price)+' × '+c.qty+'</div></div>';
h+='<div class="qty-ctrl"><button class="qty-btn" onclick="changeQty(\''+c.id+'\',-1)">−</button><span class="qty-val">'+c.qty+'</span><button class="qty-btn" onclick="changeQty(\''+c.id+'\',1)">+</button></div>';
h+='<button class="remove-btn" onclick="removeItem(\''+c.id+'\')">🗑</button></div>'
});el.innerHTML=h
}

function changeQty(id,d){
var i=cart.find(function(c){return c.id===id});if(!i)return;
var m=menus.find(function(x){return x.id===id});
if(d>0&&i.qty>=m.stock){toast('Stok tidak cukup');return}
i.qty+=d;if(i.qty<=0)cart=cart.filter(function(c){return c.id!==id});
updateCartBar();renderCartItems()
}
function removeItem(id){cart=cart.filter(function(c){return c.id!==id});updateCartBar();renderCartItems()}

document.querySelectorAll('.pay-opt').forEach(function(o){
o.addEventListener('click',function(){
document.querySelectorAll('.pay-opt').forEach(function(x){x.classList.remove('active')});
o.classList.add('active');o.querySelector('input').checked=true;payMethod=o.dataset.method;
document.getElementById('cashBox').classList.toggle('show',payMethod==='cash');
document.getElementById('splitBox').classList.toggle('show',payMethod==='split');
if(payMethod==='cash')setCash('pas');if(payMethod==='split')calcSplit()
})
});

function openPayment(){
if(!cart.length)return;currentTotal=cart.reduce(function(s,x){return s+x.price*x.qty},0);
document.getElementById('payTotal').textContent=fmt(currentTotal);document.getElementById('customerName').value='';
payMethod='cash';document.querySelectorAll('.pay-opt').forEach(function(x){x.classList.remove('active')});
document.querySelector('.pay-opt[data-method="cash"]').classList.add('active');document.querySelector('input[value="cash"]').checked=true;
document.getElementById('cashBox').classList.add('show');document.getElementById('splitBox').classList.remove('show');
setCash('pas');closeModal('modalCart');document.getElementById('modalPay').classList.add('show')
}

function setCash(v){document.getElementById('cashReceived').value=v==='pas'?currentTotal:v;calcChange()}
function addCash(a){var c=parseInt(document.getElementById('cashReceived').value)||0;document.getElementById('cashReceived').value=c+a;calcChange()}
function calcChange(){var r=parseInt(document.getElementById('cashReceived').value)||0,c=r-currentTotal;document.getElementById('changeVal').textContent=fmt(c>0?c:0);document.getElementById('changeVal').style.color=c>=0?'var(--accent-light)':'var(--danger)'}
function calcSplit(){var c=parseInt(document.getElementById('cashInput').value)||0;if(c>currentTotal)c=currentTotal;document.getElementById('qrisPartVal').textContent=fmt(currentTotal-c)}

function processPayment(){
if(!cart.length)return;var total=currentTotal,cashPart=0,qrisPart=0,customer=document.getElementById('customerName').value.trim();
if(payMethod==='cash')cashPart=total;else if(payMethod==='qris')qrisPart=total;
else{cashPart=parseInt(document.getElementById('cashInput').value)||0;if(cashPart<0)cashPart=0;if(cashPart>total)cashPart=total;qrisPart=total-cashPart}
var i=0;function next(){
if(i>=cart.length){saveTrx();return}
var item=cart[i],m=menus.find(function(x){return x.id===item.id});
if(m){m.stock=Math.max(0,m.stock-item.qty);dbPut('/menus/'+m.id,m).then(function(){i++;next()})}else{i++;next()}
}
function saveTrx(){
var now=Date.now(),trx={items:cart.map(function(c){return{id:c.id,name:c.name,price:c.price,qty:c.qty}}),total:total,cashPart:cashPart,qrisPart:qrisPart,method:payMethod,customer:customer||'',timestamp:now,date:formatDateTime(now)};
dbPost('/transactions',trx).then(function(res){if(res&&res.name){trx.id=res.name;transactions.unshift(trx)}
cart=[];updateCartBar();closeModal('modalPay');renderMenus();renderStok();toast('Transaksi berhasil!')})
}
next()
}

function renderStok(){
var el=document.getElementById('stokList');
if(!menus.length){el.innerHTML='<div class="empty"><div class="empty-icon">📦</div>Belum ada menu</div>';return}
var rows='';menus.forEach(function(m){
rows+='<tr><td><div style="font-weight:600">'+m.name+'</div><div style="font-size:.7rem;color:var(--muted)">'+m.category+'</div></td>';
rows+='<td style="color:var(--accent-light);font-weight:600">'+fmt(m.price)+'</td>';
rows+='<td><input type="number" value="'+m.stock+'" min="0" id="stock-'+m.id+'" onchange="updateStock(\''+m.id+'\')"></td>';
rows+='<td class="action-btns"><button class="icon-btn" onclick="editMenu(\''+m.id+'\')">✎</button><button class="icon-btn del" onclick="deleteMenu(\''+m.id+'\')">🗑</button></td></tr>'
});
el.innerHTML='<table class="stok-table"><thead><tr><th>Menu</th><th>Harga</th><th>Stok</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'
}

function updateStock(id){var m=menus.find(function(x){return x.id===id});if(!m)return;m.stock=Math.max(0,parseInt(document.getElementById('stock-'+id).value)||0);dbPut('/menus/'+id,m);renderMenus();toast('Stok diupdate')}
function openAddMenu(){document.getElementById('menuModalTitle').textContent='Tambah Menu';document.getElementById('editMenuId').value='';document.getElementById('menuName').value='';document.getElementById('menuPrice').value='';document.getElementById('menuStock').value='0';document.getElementById('menuCat').value='Espresso Based';document.getElementById('modalMenu').classList.add('show')}
function editMenu(id){var m=menus.find(function(x){return x.id===id});if(!m)return;document.getElementById('menuModalTitle').textContent='Edit Menu';document.getElementById('editMenuId').value=id;document.getElementById('menuName').value=m.name;document.getElementById('menuPrice').value=m.price;document.getElementById('menuStock').value=m.stock;document.getElementById('menuCat').value=m.category;document.getElementById('modalMenu').classList.add('show')}
function saveMenu(){
var id=document.getElementById('editMenuId').value,name=document.getElementById('menuName').value.trim(),price=parseInt(document.getElementById('menuPrice').value)||0,stock=parseInt(document.getElementById('menuStock').value)||0,cat=document.getElementById('menuCat').value;
if(!name||price<=0){toast('Nama & harga wajib');return}
if(id){var m=menus.find(function(x){return x.id===id});if(m){m.name=name;m.price=price;m.stock=stock;m.category=cat;dbPut('/menus/'+id,m)}}
else{var nid='m'+Date.now(),m={id:nid,name:name,price:price,stock:stock,category:cat};menus.push(m);dbPut('/menus/'+nid,m)}
closeModal('modalMenu');renderCategories();renderMenus();renderStok();toast('Menu disimpan')
}
function deleteMenu(id){menus=menus.filter(function(m){return m.id!==id});dbPut('/menus/'+id,null);renderCategories();renderMenus();renderStok();toast('Menu dihapus')}

function renderRiwayat(){
var to=0,tc=0,tq=0;
transactions.forEach(function(t){to+=t.total||0;tc+=t.cashPart||0;tq+=t.qrisPart||0});
document.getElementById('omsetTotal').textContent=fmt(to);document.getElementById('omsetCash').textContent=fmt(tc);document.getElementById('omsetQris').textContent=fmt(tq);
var el=document.getElementById('trxList');
if(!transactions.length){el.innerHTML='<div class="empty"><div class="empty-icon">📋</div>Belum ada transaksi</div>';return}
var h='';transactions.forEach(function(t){
var items=(t.items||[]).map(function(i){return i.name+' ×'+i.qty}).join(', ');
var ml=t.method==='cash'?'Cash':(t.method==='qris'?'QRIS':'Split');
var nh=t.customer?'<div class="trx-name">👤 '+t.customer+'</div>':'';
h+='<div class="trx-item"><button class="trx-del" onclick="deleteTrx(\''+t.id+'\')">🗑</button>';
h+='<div class="trx-head"><span class="trx-date">'+(t.date||formatDateTime(t.timestamp))+'</span><span class="trx-total">'+fmt(t.total)+'</span></div>'+nh;
h+='<div style="display:flex;gap:8px;align-items:center;margin-top:2px"><span class="trx-method">'+ml+'</span>';
if(t.method==='split')h+='<span style="font-size:.75rem;color:var(--muted)">Cash '+fmt(t.cashPart)+' + QRIS '+fmt(t.qrisPart)+'</span>';
h+='</div><div class="trx-items">'+items+'</div></div>'
});el.innerHTML=h
}

function deleteTrx(id){transactions=transactions.filter(function(t){return t.id!==id});dbPut('/transactions/'+id,null);renderRiwayat();toast('Transaksi dihapus')}
function deleteAllTrx(){
if(!transactions.length){toast('Tidak ada transaksi');return}
var ids=transactions.map(function(t){return t.id});
var i=0;function next(){if(i>=ids.length){transactions=[];renderRiwayat();toast('Semua riwayat dihapus');return}
dbPut('/transactions/'+ids[i],null).then(function(){i++;next()})}
next()
}

function openRekapText(){
var to=0,tc=0,tq=0;transactions.forEach(function(t){to+=t.total||0;tc+=t.cashPart||0;tq+=t.qrisPart||0});
var text='=== PIJAR NETRA POS - REKAP ===\nTanggal Cetak: '+formatDateTime(Date.now())+'\n\n';
text+='TOTAL OMSET   : '+fmt(to)+'\nTOTAL CASH    : '+fmt(tc)+'\nTOTAL QRIS    : '+fmt(tq)+'\nJUMLAH TRX    : '+transactions.length+'\n\n--- DAFTAR TRANSAKSI ---\n';
if(!transactions.length)text+='(Belum ada transaksi)\n';
else transactions.forEach(function(t,i){
text+='\n'+(i+1)+'. '+(t.date||formatDateTime(t.timestamp));if(t.customer)text+=' | Atas Nama: '+t.customer;
text+='\n   Total: '+fmt(t.total)+' | '+(t.method==='cash'?'Cash':t.method==='qris'?'QRIS':'Split')+'\n';
if(t.method==='split')text+='   Cash: '+fmt(t.cashPart)+' | QRIS: '+fmt(t.qrisPart)+'\n';
(t.items||[]).forEach(function(it){text+='   - '+it.name+' ×'+it.qty+' @ '+fmt(it.price)+'\n'})
});
text+='\n==============================';
document.getElementById('rekapText').value=text;document.getElementById('modalRekap').classList.add('show')
}

function copyRekap(){var ta=document.getElementById('rekapText');ta.select();ta.setSelectionRange(0,99999);try{document.execCommand('copy');toast('Teks berhasil disalin!')}catch(e){toast('Gagal menyalin')}}
function fmt(n){return Math.round((n||0)/1000).toString()}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1800)}
function openBgSetting(){document.getElementById('modalBg').classList.add('show')}
function handleBgFile(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){applyBackground(e.target.result);localStorage.setItem('pijar_bg',e.target.result);toast('Background berhasil diganti');closeModal('modalBg')};r.readAsDataURL(f)}
function applyBackground(b64){var a=document.getElementById('app');a.style.backgroundImage='url('+b64+')';a.classList.add('has-bg')}
function resetBg(){var a=document.getElementById('app');a.style.backgroundImage='';a.classList.remove('has-bg');localStorage.removeItem('pijar_bg');toast('Background direset');closeModal('modalBg')}
function loadSavedBg(){var s=localStorage.getItem('pijar_bg');if(s)applyBackground(s)}

document.querySelectorAll('.modal-overlay').forEach(function(ov){ov.addEventListener('click',function(e){if(e.target===ov)ov.classList.remove('show')})});
history.pushState(null,null,location.href);
window.addEventListener('popstate',function(){history.pushState(null,null,location.href);var m=document.querySelectorAll('.modal-overlay.show');if(m.length)m[m.length-1].classList.remove('show')});

loadSavedBg();
init();
</script>
</body>
</html>
